  cursor: crosshair;
}

.hud {
  position: fixed;
  inset: 0;
  pointer-events: none;
  user-select: none;
}

.crosshair {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 20px;
  height: 20px;
  transform: translate(-50%, -50%);
  mix-blend-mode: difference;
}

.crosshair::before,
.crosshair::after {
  content: '';
  position: absolute;
  background: #fff;
}

.crosshair::before {
  top: 50%;
  left: 0;
  width: 100%;
  height: 2px;
  transform: translateY(-50%);
}

.crosshair::after {
  left: 50%;
  top: 0;
  width: 2px;
  height: 100%;
  transform: translateX(-50%);
}

.hotbar {
  position: absolute;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 4px;
  padding: 4px;
  background: rgba(0, 0, 0, 0.35);
  border-radius: 6px;
}

.health {
  position: absolute;
  bottom: 86px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 3px;
  font-size: 20px;
  line-height: 1;
  text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.9);
}

.heart.full {
  color: #e23b3b;
}

.heart.half {
  color: #e23b3b;
  opacity: 0.5;
}

.heart.empty {
  color: #2b2b2b;
}

.air {
  position: absolute;
  bottom: 110px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 4px;
  font-size: 13px;
  line-height: 1;
  color: #9fd8ff;
  text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.9);
}

.air.hidden {
  display: none;
}

.bubble.empty {
  opacity: 0.15;
}

.damage-flash {
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at center, rgba(180, 0, 0, 0) 35%, rgba(180, 0, 0, 0.75) 100%);
  opacity: 0;
}

.damage-flash.active {
  animation: damage-fade 0.45s ease-out;
}

@keyframes damage-fade {
  from {
    opacity: 1;
  }
  to {
    opacity: 0;
  }
}

.banner {
  position: absolute;
  top: 38%;
  left: 50%;
  transform: translate(-50%, -50%);
  padding: 10px 22px;
  font-size: 26px;
  letter-spacing: 2px;
  color: #ffdede;
  background: rgba(90, 0, 0, 0.55);
  border-radius: 8px;
  text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.8);
}

.banner.hidden {
  display: none;
}

.fire {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse at 50% 120%, rgba(255, 170, 40, 0.85) 0%, rgba(255, 90, 10, 0.4) 35%, rgba(255, 60, 0, 0) 65%),
    radial-gradient(ellipse at center, rgba(255, 70, 0, 0) 45%, rgba(170, 40, 0, 0.5) 100%);
  animation: flicker 0.35s steps(2, end) infinite alternate;
}

.fire.hidden {
  display: none;
}

.sick {
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at center, rgba(90, 150, 40, 0) 30%, rgba(74, 128, 32, 0.55) 100%);
  animation: queasy 3.2s ease-in-out infinite alternate;
}

.sick.hidden {
  display: none;
}

.toast {
  position: absolute;
  bottom: 134px;
  left: 50%;
  transform: translateX(-50%);
  padding: 5px 14px;
  border-radius: 4px;
  background: rgba(0, 0, 0, 0.55);
  font-size: 14px;
  white-space: nowrap;
  color: #ffe9b8;
  text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.9);
  opacity: 0;
}

.toast.active {
  animation: toast-fade 1.6s ease-out;
}

@keyframes toast-fade {
  0%,
  60% {
    opacity: 1;
  }
  to {
    opacity: 0;
  }
}

@keyframes queasy {
  from {
    opacity: 0.45;
  }
  to {
    opacity: 0.95;
  }
}

@keyframes flicker {
  from {
    opacity: 0.75;
    transform: scaleY(1);
  }
  to {
    opacity: 1;
    transform: scaleY(1.04);
  }
}

.mining-bar {
  position: absolute;
  top: calc(50% + 24px);
  left: 50%;
  width: 140px;
  height: 6px;
  transform: translateX(-50%);
  background: rgba(0, 0, 0, 0.55);
  border: 1px solid rgba(255, 255, 255, 0.35);
  border-radius: 3px;
  overflow: hidden;
}

.mining-bar.hidden {
  display: none;
}

.mining-bar > div {
  height: 100%;
  width: 0;
  background: #e8e8e8;
}

.inventory {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  background: rgba(8, 14, 24, 0.72);
  backdrop-filter: blur(3px);
  pointer-events: auto;
}

.inventory.hidden {
  display: none;
}

.inv-panel {
  width: min(820px, 94vw);
  max-height: 86vh;
  overflow-y: auto;
  padding: 22px 26px;
  color: #eef2f7;
  background: rgba(16, 22, 34, 0.94);
  border: 1px solid rgba(255, 255, 255, 0.16);
  border-radius: 10px;
}

.inv-panel h2 {
  margin: 0 0 4px;
  letter-spacing: 1px;
}

.inv-note {
  margin: 0 0 12px;
  font-size: 13px;
  color: #9fd4ff;
}

.inv-section {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin: 18px 0 8px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.12);
}

.inv-section h3 {
  margin: 0 0 4px;
  font-size: 15px;
  letter-spacing: 0.5px;
}

.inv-section small {
  color: #93a2b4;
  font-size: 12px;
}

.inv-hotbar {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.inv-items {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.inv-slot,
.inv-item {
  position: relative;
  width: 56px;
  height: 56px;
  display: grid;
  place-items: center;
  padding: 0;
  background: rgba(255, 255, 255, 0.06);
  border: 2px solid rgba(255, 255, 255, 0.18);
  border-radius: 5px;
  cursor: pointer;
}

.inv-slot:hover,
.inv-item:hover {
  background: rgba(255, 255, 255, 0.16);
}

.inv-slot.selected {
  border-color: #ffd770;
  box-shadow: 0 0 0 2px rgba(255, 215, 112, 0.3);
}

.inv-item.equipped {
  border-color: rgba(143, 211, 255, 0.8);
}

.inv-slot canvas,
.inv-item canvas {
  image-rendering: pixelated;
}

.inv-count {

  right: 3px;
  bottom: 1px;
  font-size: 12px;
  font-weight: 700;
  color: #fff;
  text-shadow: 1px 1px 0 #000;
}

.inv-key {
  position: absolute;
  top: 1px;
  left: 4px;
  font-size: 10px;
  color: rgba(255, 255, 255, 0.7);
  text-shadow: 1px 1px 0 #000;
}

.inv-empty {
  margin: 0;
  font-size: 13px;
  color: #93a2b4;
}

  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 8px;
}

.recipe {

  align-items: center;
  gap: 10px;
  padding: 8px;
  font: inherit;
  text-align: left;
  color: inherit;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 6px;
  cursor: pointer;
}

.recipe:hover:not(:disabled) {
  background: rgba(255, 255, 255, 0.14);
}

.recipe:disabled {
  opacity: 0.4;
  cursor: default;
}

.recipe.locked {
  border-style: dashed;
}

.recipe canvas {
  image-rendering: pixelated;
  flex: 0 0 auto;
}

.recipe-text {
  display: flex;
  flex-direction: column;
  line-height: 1.35;
}

.recipe-text small {
  color: #a9b7c6;
  font-size: 12px;
}

.inv-close {
  margin-top: 18px;
  padding: 8px 16px;
  font: inherit;
  color: #eef2f7;
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 6px;
  cursor: pointer;
}

.slot {
  position: relative;
  width: 52px;
  height: 52px;
  display: grid;
  place-items: center;
  border: 2px solid rgba(255, 255, 255, 0.25);
  border-radius: 4px;
  background: rgba(0, 0, 0, 0.3);
}

.slot canvas {
  image-rendering: pixelated;
  width: 40px;
  height: 40px;
}

.slot.selected {
  border-color: #fff;
  box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.35);
}

.slot-key {
  position: absolute;
  top: 1px;
  left: 4px;
  font-size: 11px;
  color: rgba(255, 255, 255, 0.75);
  text-shadow: 1px 1px 0 #000;
}

.slot-count {
  position: absolute;
  right: 3px;
  bottom: 1px;
  font-size: 13px;
  font-weight: 700;
  color: #fff;
  text-shadow: 1px 1px 0 #000;
}

.slot.empty canvas {
  opacity: 0.3;
}

.debug {
  position: absolute;
  top: 10px;
  left: 12px;
  font-size: 13px;
  font-family: 'Cascadia Mono', Consolas, monospace;
  color: #fff;
  text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.8);
}

.overlay {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  background: rgba(8, 14, 24, 0.6);
  backdrop-filter: blur(3px);
  pointer-events: auto;
  cursor: pointer;
}

.overlay.hidden {
  display: none;
}

.panel {
  width: min(980px, 96vw);
  padding: 28px 34px;
  text-align: center;
  color: #f2f5f8;
  background: rgba(16, 22, 34, 0.85);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 10px;
}

.panel h1 {
  margin: 0 0 6px;
  font-size: 30px;
  letter-spacing: 1px;
}

.panel .hint {
  margin: 0 0 18px;
  color: #9fd4ff;
}

.difficulty {

  gap: 10px;
  justify-content: center;
  margin-bottom: 20px;
}

.difficulty-btn {

  flex-direction: column;
  gap: 3px;
  width: 200px;
  padding: 10px 12px;
  font: inherit;
  color: #eef2f7;
  background: rgba(255, 255, 255, 0.07);
  border: 2px solid rgba(255, 255, 255, 0.18);
  border-radius: 7px;
  cursor: pointer;
}

.difficulty-btn:hover {
  background: rgba(255, 255, 255, 0.16);
}

.difficulty-btn.active {
  border-color: #ffd770;
  background: rgba(255, 215, 112, 0.16);
}

.difficulty-btn b {
  font-size: 16px;
  letter-spacing: 0.5px;
}

.difficulty-btn small {
  font-size: 11px;
  line-height: 1.3;
  color: #b7c4d3;
}

.panel ul {
  margin: 0;
  padding: 0;
  list-style: none;
  font-size: 14px;
  line-height: 1.9;
  color: #c9d4e0;
}

.panel .warn {
  margin-top: 8px;
  color: #ffb4a0;
}

.trade-panel {

}

.trade-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.trade {
  display: grid;
  grid-template-columns: 1fr auto 1fr auto;
  align-items: center;
  gap: 12px;
  padding: 8px 12px;
  font: inherit;
  color: inherit;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 6px;
  cursor: pointer;
}

.trade:hover:not(:disabled) {
  background: rgba(255, 255, 255, 0.14);
}

.trade:disabled {
  opacity: 0.45;
  cursor: default;
}

.trade.sold-out {
  border-style: dashed;
}

.trade-side {
  display: flex;
  gap: 6px;
}

.trade-stack {
  position: relative;
  display: grid;
  place-items: center;
}

.trade-stack canvas {
  image-rendering: pixelated;
}

.trade-arrow {
  color: #9fd4ff;
  font-size: 18px;
}

.trade-status {
  color: #a9b7c6;
  font-size: 12px;
  text-align: right;
}
